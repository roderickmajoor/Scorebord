<!DOCTYPE html>
<html>

<head>

<title>Sponsors</title>

<script src="https://cdn.socket.io/4.0.0/socket.io.min.js"></script>

<style>

html,body{

    margin:0;
    padding:0;

    width:100%;
    height:100%;

    background:black;

    overflow:hidden;

}


video{

    width:100vw;
    height:100vh;

    object-fit:cover;

}

</style>

</head>


<body>


<video
    id="sponsorVideo"
    autoplay
    muted>

    <source src="/static/sponsors.mp4" type="video/mp4">

</video>

<script>
const video = document.getElementById("sponsorVideo");


window.addEventListener("message", event => {

    if (!event.data) {
        return;
    }


    /*
        Sponsorvideo één keer afspelen
    */

    if (event.data.type === "playSponsor") {

        video.loop = false;

        video.currentTime = 0;

        video.play();

    }


    /*
        Sponsorvideo continu afspelen
    */

    if (event.data.type === "playSponsorLoop") {

        video.loop = true;

        video.currentTime = 0;

        video.play();

    }

});


/*
    Sponsorvideo is afgelopen
*/

video.addEventListener("ended", () => {

    window.parent.postMessage(
        {
            type: "sponsorFinished"
        },
        "*"
    );

});
</script>


</body>

</html>
